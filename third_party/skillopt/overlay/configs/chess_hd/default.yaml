_base_: ../_base_/default.yaml

# SkillOpt on chess puzzles through D-Skill's qwen harness (envs.chess.run_puzzles).
# Optimizer: Claude Sonnet 5 at an OpenAI-compatible endpoint (see README.md); no teacher.
# Split: 60 train / 40 val of the 100 distillation puzzles, stratified by rating band.
model:
  optimizer: claude-sonnet-5
  target: qwen3.6-35b-a3b
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  reasoning_effort: medium

train:
  num_epochs: 4
  train_size: 60
  batch_size: 20        # 3 steps per epoch -> 12 steps
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 4

optimizer:
  learning_rate: 4

evaluation:
  sel_env_num: 0        # whole val split (40)
  test_env_num: 0
  eval_test: false      # test evals are run separately (envs.chess.run_puzzles)

env:
  name: chess_hd
  skill_init: skillopt/envs/chess_hd/skills/skeleton_chess_v5_body.md
  split_mode: split_dir
  split_dir: data/chess_split60
  workers: 12
  tools: 10
